name: Release

# Build the desktop app on every OS and attach the artifacts to the GitHub
# Release for the pushed tag. Electron installers can't be cross-compiled, so
# each platform's binary is built on its own runner:
#   - macOS   → .zip (arm64 + x64)
#   - Windows → Squirrel .exe installer + .zip
#   - Linux   → .deb, .rpm, .zip
#
# Trigger: push a v* tag (publish.sh does this). You can also run it by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach artifacts to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # needed to create/append to the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The .deb / .rpm makers need dpkg + rpm + fakeroot on the Linux runner.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg fakeroot rpm

      - name: Install dependencies
        run: npm ci

      # macOS: build arm64 and x64 separately so both Apple Silicon and Intel Macs
      # are covered. (A universal binary can't be merged reliably here — the arm64
      # and x64 bundles ship a different set of native mach-o files.) Other OSes
      # build for their default (x64) arch.
      - name: Build distributables (macOS arm64)
        if: runner.os == 'macOS'
        run: npm run make -- --arch=arm64

      - name: Build distributables (macOS x64)
        if: runner.os == 'macOS'
        run: npm run make -- --arch=x64

      - name: Build distributables
        if: runner.os != 'macOS'
        run: npm run make

      - name: Upload artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/*.deb
            out/make/**/*.rpm
          fail_on_unmatched_files: false
